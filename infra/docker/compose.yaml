services:
  postgres:
    image: postgres:17-alpine
    container_name: dylan-grand-postgres
    environment:
      POSTGRES_DB: dylan_grand_hotel
      POSTGRES_USER: dylan
      POSTGRES_PASSWORD: dylan_local_password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dylan -d dylan_grand_hotel']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
